# SonarQube Cloud settings (read by the "Code quality" job in .github/workflows/pipeline.yaml).
# Defaults when importing GitHub org "AjinOrg": organization "ajinorg", project key "AjinOrg_orders".
sonar.organization=ajinorg
sonar.projectKey=AjinOrg_orders
sonar.projectName=orders

sonar.sources=orders
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Coverage from `pytest --cov` (Cobertura XML)
sonar.python.coverage.reportPaths=coverage.xml
# server.py only starts waitress and handles signals; the logic in app.py is fully unit-tested
sonar.coverage.exclusions=orders/server.py
